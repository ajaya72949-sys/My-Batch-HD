name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Cordova APK
      run: |
        npm install -g cordova
        cordova create app com.allbatches.app AllBatches
        cd app
        
        # HTML Copy
        if [ -f "../index.html" ]; then cp ../index.html www/index.html; fi
        
        # Logo & Splash Setup
        if [ -f "../Screenshot_20260815-163955.png" ]; then 
          cp ../Screenshot_20260815-163955.png www/icon.png
          cp ../Screenshot_20260815-163955.png www/splash.png
        fi
        
        # Plugins Setup
        cordova plugin add cordova-plugin-fullscreen
        cordova plugin add cordova-plugin-screen-orientation
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-splashscreen
        cordova platform add android
        
        # Config.xml Customization (Default orientation = sensor / portrait)
        python3 -c '
        with open("config.xml", "r") as f:
            content = f.read()
        
        extra_config = """    <icon src="www/icon.png" />
            <preference name="Fullscreen" value="true" />
            <preference name="Orientation" value="sensor" />
            <preference name="StatusBarOverlaysWebView" value="true" />
            <preference name="StatusBarBackgroundColor" value="#000000" />
            <preference name="SplashScreen" value="splash" />
            <preference name="SplashScreenDelay" value="4000" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="true" />
            <preference name="ShowSplashScreenSpinner" value="false" />
            <preference name="AndroidPostSplashScreenTheme" value="@style/Theme.AppCompat.NoActionBar" />
        """
        content = content.replace("</widget>", extra_config + "</widget>")
        
        with open("config.xml", "w") as f:
            f.write(content)
        '

        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AllBatches-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
